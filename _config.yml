title: Moon Hyungju Portfolio
description: 실서비스를 만들며 운영 가능한 구조와 검증 가능한 개선을 고민하는 백엔드 개발자 문형주의 포트폴리오입니다.
lang: ko-KR

theme: minima

author:
  name: Moon Hyungju

header_pages:
  - resume.md

collections:
  projects:
    output: true
    permalink: /projects/:path/
  notes:
    output: true
    permalink: /notes/:path/

defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "document"
  - scope:
      path: ""
      type: "notes"
    values:
      layout: "document"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
