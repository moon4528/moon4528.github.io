title: Moon Hyungju Blog
description: Backend projects, architecture notes, and troubleshooting records.
lang: ko-KR

theme: minima

author:
  name: Moon Hyungju

header_pages:
  - projects.md
  - notes.md
  - about.md

collections:
  projects:
    output: true
    permalink: /projects/:path/
  notes:
    output: true
    permalink: /notes/:path/

defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "document"
  - scope:
      path: ""
      type: "notes"
    values:
      layout: "document"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
