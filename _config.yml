title: 형주의 개발 블로그
description: 백엔드 개발과 프로젝트 경험을 기록합니다.
lang: ko-KR

theme: minima

author:
  name: 문형주

header_pages:
  - projects.md
  - notes.md
  - about.md

collections:
  projects:
    output: true
    permalink: /projects/:path/
  notes:
    output: true
    permalink: /notes/:path/

defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "document"
  - scope:
      path: ""
      type: "notes"
    values:
      layout: "document"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
