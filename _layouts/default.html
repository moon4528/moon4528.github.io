<!doctype html>
<html lang="{{ site.lang | default: 'ko-KR' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title and page.title != site.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <a class="site-title" href="{{ '/' | relative_url }}">
        <span class="site-mark">MH</span>
        <span>문형주 <small>Backend Engineer</small></span>
      </a>
      <nav class="site-nav" aria-label="주요 탐색">
        <a href="{{ '/#strengths' | relative_url }}">핵심 역량</a>
        <a href="{{ '/#stack' | relative_url }}">기술 스택</a>
        <a href="{{ '/#projects' | relative_url }}">프로젝트</a>
        <a href="{{ '/#history' | relative_url }}">히스토리</a>
        <a href="{{ '/#contact' | relative_url }}">Contact</a>
        <a class="nav-resume" href="{{ '/resume/' | relative_url }}">이력서</a>
      </nav>
    </header>

    <main class="site-main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <strong>문형주 · Backend Engineer</strong>
      <span>문제를 정의하고, 선택의 근거를 남기며, 결과를 검증합니다.</span>
    </footer>
  </body>
</html>
